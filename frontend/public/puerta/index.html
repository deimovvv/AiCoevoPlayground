<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coevo Studio</title>
<meta name="description" content="El espacio de trabajo de Coevo. Acceso por invitación.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f3f0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<!--
  La puerta de app.coevoagency.com (openspec/changes/studio-v2): la única página abierta, sin datos.
  No carga nada de Studio. «Entrar» lleva al login de Cloudflare Access (Google o PIN por mail) y,
  adentro, cada uno va a lo suyo. Si ya hay sesión, el servidor redirige directo a Studio.
  Las imágenes son piezas reales aprobadas, sin filtros encima: lo que se muestra es el trabajo.
-->
<style>
  :root { --ink: #141413; --mute: #6f6e6a; --faint: #8f8e89; --line: #dcdbd6; --bg: #f4f3f0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .06em; }

  .stage { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(420px, 38%) minmax(0, 1fr); }

  .text { display: flex; flex-direction: column; padding: clamp(24px, 2.6vw, 40px); }
  header { display: flex; align-items: baseline; gap: 10px; }
  .word { font-size: 20px; font-weight: 500; letter-spacing: -.04em; }
  .tag { color: var(--faint); }

  main { margin-top: auto; }
  h1 { margin: 0; font-weight: 400; font-size: clamp(36px, 3.7vw, 62px); line-height: 1.02; letter-spacing: -.035em; }
  h1 em { font-style: normal; color: var(--faint); }
  .lead { margin: 20px 0 0; max-width: 36ch; font-size: 15px; line-height: 1.5; color: var(--mute); }

  .enter { display: inline-flex; align-items: center; justify-content: space-between; gap: 40px; height: 46px; margin-top: 32px; padding: 0 16px 0 18px; background: var(--ink); color: var(--bg); text-decoration: none; font-size: 14px; font-weight: 500; transition: background .2s ease; }
  .enter:hover { background: #3a3a37; }
  .enter svg { transition: transform .2s ease; }
  .enter:hover svg { transform: translateX(3px); }
  .enter:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  footer { display: flex; justify-content: space-between; gap: 16px; margin-top: clamp(40px, 9vh, 96px); padding-top: 14px; border-top: 1px solid var(--line); color: var(--faint); }
  footer a { text-decoration: none; }
  footer a:hover { color: var(--ink); }

  .work { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr); gap: 2px; min-height: 0; height: 100vh; height: 100dvh; position: sticky; top: 0; }
  .work img { display: block; width: 100%; height: 100%; min-width: 0; min-height: 0; object-fit: cover; opacity: 0; animation: in .9s ease forwards; }
  .work img + img { animation-delay: .12s; }
  @keyframes in { to { opacity: 1; } }

  @media (max-width: 860px) {
    .stage { grid-template-columns: 1fr; }
    .work { order: -1; height: 52vh; height: 52dvh; position: static; }
    .text { padding: 20px; min-height: 48vh; min-height: 48dvh; }
    main { margin-top: 28px; }
    h1 { font-size: 34px; }
    .enter { display: flex; width: 100%; margin-top: 24px; }
    footer { margin-top: 32px; }
    footer a { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .work img { animation: none; opacity: 1; } .enter svg { transition: none; } }
</style>
</head>
<body>
<div class="stage">
  <div class="text">
    <header><span class="word">coevo</span><span class="mono tag">Studio</span></header>
    <main>
      <h1>Tu marca,<br><em>con alguien que elige.</em></h1>
      <p class="lead">Lo que la marca es, las piezas en revisión y lo que ya salió. En un solo lugar.</p>
      <a class="enter" href="/dashboard">Entrar
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
      </a>
    </main>
    <footer class="mono">
      <span>Acceso por invitación</span>
      <span>Foto: Koxis</span>
      <a href="https://coevoagency.com">coevoagency.com</a>
    </footer>
  </div>
  <div class="work">
    <img src="/puerta/img/koxis-nubes.webp" alt="Pieza de moda de Koxis: retrato con anteojos y chaleco de denim sobre un cielo." width="1000" height="1500">
    <img src="/puerta/img/koxis-sweaters.webp" alt="Pieza de producto de Koxis: tres sweaters atados con un cordón rojo, sostenidos en el aire." width="837" height="1500">
  </div>
</div>
</body>
</html>
